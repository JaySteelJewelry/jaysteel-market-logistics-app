name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test tests/site.test.mjs
      - run: |
          fail=0
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f" || fail=1; done
          python3 -c "import json;[json.load(open(f)) for f in ['data/events.json','data/opportunities.json','manifest.webmanifest']]"
          exit $fail