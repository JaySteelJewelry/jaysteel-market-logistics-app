<script>
/* unlock gate (optional). Set unlock: null to keep the app open. */
(function(){
  var K="md.auth",P="md.pw2";
  var want=null; try{ want=(window.MARKETDESK&&window.MARKETDESK.unlock)||null; }catch(e){}
  if(!want){return;}
  var d=document.documentElement, D=document;
  D.addEventListener("DOMContentLoaded",function(){
    var ok=false;try{ok=localStorage.getItem(K)===want;}catch(e){}
    if(ok){D.getElementById("app").removeAttribute("data-locked");return;}
    d.setAttribute("data-locked","1");
    var g=D.createElement("div");g.id="gate";g.innerHTML='<form><img src="assets/icon-192.png" alt=""><h1>MARKETDESK</h1><input id="gpw" type="password" placeholder="Password" required autocomplete="current-password"><button type="submit">Unlock</button><p id="gerr" role="alert"></p></form>';
    D.body.appendChild(g);
    g.querySelector("form").addEventListener("submit",async function(e){
      e.preventDefault();var v=D.getElementById("gpw").value;
      var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));
      var h=Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
      if(h===want){try{localStorage.setItem(K,want);}catch(_){}}else{D.getElementById("gerr").textContent="Wrong password";return;}
      g.remove();d.removeAttribute("data-locked");
    });
  });
})();
</script>
